<!DOCTYPE html>
<html>
<head>
<title>3D Flip Card</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#111;
}
.card{
  width:250px;
  height:350px;
  perspective:1000px;
}
.inner{
  width:100%;
  height:100%;
  position:relative;
  transition:1s;
  transform-style:preserve-3d;
}
.card:hover .inner{
  transform:rotateY(180deg);
}
.front, .back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:20px;
}
.front{
  background:#667eea;
}
.back{
  background:#ff4b2b;
  transform:rotateY(180deg);
}
</style>
</head>
<body>

<div class="card">
  <div class="inner">
    <div class="front">Product</div>
    <div class="back">Buy Now</div>
  </div>
</div>

</body>
</html>
