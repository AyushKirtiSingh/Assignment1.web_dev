<!DOCTYPE html>
<html>
<head>
<title>Hover Reveal</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  position:relative;
  width:300px;
}
img{
  width:200%;
  display:block;
}
.overlay{
  position:absolute;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:0.5s;
}
.container:hover .overlay{
  opacity:1;
}
</style>
</head>
<body>

<div class="container">
  <img src="gojo.webp">
  <div class="overlay">View Details</div>
</div>

</body>
</html>
