<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Admin Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  display:flex;
  min-height:100vh;
  transition:0.3s;
}

body.dark{
  background:#0f172a;
  color:white;
}

.sidebar{
  width:250px;
  background:#1e293b;
  color:white;
  padding:20px;
  transition:0.3s;
}

.sidebar h2{
  margin-bottom:20px;
}

.sidebar button{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  cursor:pointer;
  background:#334155;
  color:white;
  border-radius:5px;
}

.main{
  flex:1;
  padding:20px;
  background:#f1f5f9;
  transition:0.3s;
}

body.dark .main{
  background:#1e293b;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  padding:20px;
  border-radius:10px;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

body.dark .card{
  background:#334155;
}

.card:hover{
  transform:translateY(-5px);
}

.notes{
  margin-top:40px;
}

.notes ul{
  list-style:none;
  margin-top:15px;
}

.notes li{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:5px;
  display:flex;
  justify-content:space-between;
}

body.dark .notes li{
  background:#334155;
}

button.action{
  padding:6px 10px;
  cursor:pointer;
  border:none;
  border-radius:5px;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  display:none;
}

.modal-content{
  background:white;
  padding:30px;
  border-radius:10px;
  width:300px;
}

.modal input{
  width:100%;
  padding:8px;
  margin-top:10px;
}

@media(max-width:768px){
  .sidebar{
    position:absolute;
    left:-250px;
    height:100%;
    z-index:10;
  }
  .sidebar.active{
    left:0;
  }
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <h2>Dashboard</h2>
  <button onclick="toggleTheme()">Toggle Dark Mode</button>
  <button onclick="openModal()">Add Note</button>
</div>

<div class="main">
  <div class="topbar">
    <h1>Smart Admin Panel</h1>
    <button class="action" onclick="toggleSidebar()">☰</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Total Users</h3>
      <p>1,240</p>
    </div>
    <div class="card">
      <h3>Revenue</h3>
      <p>$8,560</p>
    </div>
    <div class="card">
      <h3>Tasks</h3>
      <p>23 Pending</p>
    </div>
  </div>

  <div class="notes">
    <h2>Quick Notes</h2>
    <ul id="noteList"></ul>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add New Note</h3>
    <input type="text" id="noteInput" placeholder="Enter note">
    <button class="action" onclick="addNote()">Save</button>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function saveNotes(){
  localStorage.setItem("notes", JSON.stringify(notes));
}

function renderNotes(){
  const list=document.getElementById("noteList");
  list.innerHTML="";
  notes.forEach((note,index)=>{
    let li=document.createElement("li");
    li.innerHTML=`${note} 
    <button class="action" onclick="deleteNote(${index})">X</button>`;
    list.appendChild(li);
  });
}

function addNote(){
  let input=document.getElementById("noteInput");
  if(input.value==="") return;
  notes.push(input.value);
  input.value="";
  saveNotes();
  renderNotes();
  closeModal();
}

function deleteNote(index){
  notes.splice(index,1);
  saveNotes();
  renderNotes();
}

function toggleTheme(){
  document.body.classList.toggle("dark");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
}

function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

window.onclick=function(e){
  if(e.target==document.getElementById("modal")){
    closeModal();
  }
}

renderNotes();
</script>

</body>
</html>
