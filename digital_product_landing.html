<!DOCTYPE html>
<html>
<head>
<title>Modern Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
header{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:#0f172a;
  color:white;
}
a{color:white;text-decoration:none;margin-left:20px;}
.hero{
  height:100vh;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:white;
  color:#333;
  margin-top:20px;
  cursor:pointer;
  transition:0.3s;
}
button:hover{transform:scale(1.1);}
section{padding:80px;text-align:center;}
</style>
</head>
<body>

<header>
  <h2>Brand</h2>
  <div>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>
</header>

<div class="hero">
  <h1>Build Modern Websites</h1>
  <p>Create responsive & interactive experiences</p>
  <button onclick="scrollToSection()">Get Started</button>
</div>

<section id="about">
<h2>About Us</h2>
<p>We create powerful web applications.</p>
</section>

<section id="contact">
<h2>Contact</h2>
<p>Email: example@email.com</p>
</section>

<script>
function scrollToSection(){
  document.getElementById("about").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
