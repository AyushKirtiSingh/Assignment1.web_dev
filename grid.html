<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .wrapper {
            display: grid;
            grid-template-columns: 200px 200px 200px;
        }
        * {
            box-sizing: border-box;
        }
        .wrapper {
            border: 2px solid red;
            border-radius: 5px;
            background-color: aliceblue;
        }
        .wrapper > div {
            border: 2px solid palevioletred;
            border-radius: 5px ;
            background-color: green;
            color: burlywood;

        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
</body>
</html>
