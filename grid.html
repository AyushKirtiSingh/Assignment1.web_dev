<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .wrapper {
            display: grid;
        }
        * {
            box-sizing: border-box
        }
        .wrapper {
            border: 2px red
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
</body>
</html>
