<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body { font-family: Arial; background: #f1f5f9; }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Dashboard</h2>
  <div class="dashboard">
    <div class="box">Users</div>
    <div class="box">Sales</div>
    <div class="box">Revenue</div>
  </div>
</body>
</html>
