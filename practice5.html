<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Section</title>

  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    
    nav {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h2 {
      font-size: 22px;
      letter-spacing: 1px;
    }

    nav a {
      color: #cbd5e1;
      margin-left: 25px;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: white;
    }

    
    .hero {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 22px;
      margin-bottom: 40px;
      color: #e5e7eb;
    }

    
    .buttons a {
      display: inline-block;
      padding: 14px 34px;
      margin: 10px;
      border-radius: 40px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-primary {
      background: #38bdf8;
      color: #020617;
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(56,189,248,0.4);
    }

    .btn-secondary {
      border: 2px solid #38bdf8;
      color: #38bdf8;
    }

    .btn-secondary:hover {
      background: #38bdf8;
      color: #020617;
      transform: translateY(-4px);
    }

    
    .scroll {
      position: absolute;
      bottom: 30px;
      font-size: 14px;
      color: #94a3b8;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(8px);
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav>
    <h2>DreamBuild</h2>
    <div>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Build Your Dream</h1>
      <p>Turn ideas into reality with creativity, passion, and purpose.</p>

      <div class="buttons">
        <a href="#" class="btn-primary">Get Started</a>
        <a href="#" class="btn-secondary">Learn More</a>
      </div>
    </div>

    <div class="scroll">Scroll Down ↓</div>
  </section>

</body>
</html>
