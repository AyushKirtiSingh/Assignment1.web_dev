<!DOCTYPE html>
<html>
<head>
  <title>Pricing</title>
  <style>
    body { background: #f3f4f6; font-family: Arial; }
    .pricing {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 80px;
    }
    .plan {
      background: white;
      padding: 30px;
      width: 220px;
      text-align: center;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="pricing">
    <div class="plan"><h3>Basic</h3><p>$10/mo</p></div>
    <div class="plan"><h3>Pro</h3><p>$25/mo</p></div>
    <div class="plan"><h3>Premium</h3><p>$50/mo</p></div>
  </div>
</body>
</html>
