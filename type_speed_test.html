<!DOCTYPE html>
<html>
<head>
<title>Advanced Typing Test</title>
<style>
body{
  background:#1e293b;
  color:white;
  text-align:center;
  padding:40px;
  font-family:sans-serif;
}
textarea{
  width:80%;
  height:100px;
  margin-top:20px;
}
button{padding:10px;margin-top:15px;}
</style>
</head>
<body>

<h1>Typing Speed Test</h1>
<p id="text"></p>
<textarea id="input" disabled></textarea>
<br>
<button onclick="startTest()">Start</button>
<h2 id="result"></h2>

<script>
const sentences=[
"The quick brown fox jumps over the lazy dog",
"JavaScript makes websites interactive and powerful",
"Practice daily to improve typing speed"
];

let timer=60;
let interval;
let currentText="";

function startTest(){
  currentText=sentences[Math.floor(Math.random()*sentences.length)];
  document.getElementById("text").innerText=currentText;
  document.getElementById("input").disabled=false;
  document.getElementById("input").value="";
  timer=60;

  interval=setInterval(()=>{
    timer--;
    if(timer<=0){
      clearInterval(interval);
      finishTest();
    }
  },1000);
}

function finishTest(){
  let typed=document.getElementById("input").value;
  let words=typed.trim().split(" ").length;
  let wpm=words;

  let correct=0;
  for(let i=0;i<typed.length;i++){
    if(typed[i]===currentText[i]) correct++;
  }

  let accuracy=Math.round((correct/currentText.length)*100);

  document.getElementById("result").innerText=
  `WPM: ${wpm} | Accuracy: ${accuracy}%`;
}
</script>
</body>
</html>
