<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Anchor Tag Example</title>
</head>
<body>

    <!-- External link (opens in a new tab) -->
    <a href="https://www.google.com" target="_blank">Open Google</a>
    <br><br>

    <!-- Internal page link -->
    <a href="#about">Go to About Section</a>

    <!-- Some space to show scrolling -->
    <br><br><br><br><br>

    <!-- Target section -->
    <h2 id="about">About Us</h2>
    <p>
        This is the About section of the page. Clicking the link above
        scrolls the page to this section.
    </p>

</body>
</html>
